<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SITTA SPA — Universitas Terbuka</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  
  <link rel="stylesheet" href="assets/css/style.css" />
  
  <style>
    /* ── DROPDOWN MENU DI NAVBAR ── */
    .nav-dropdown { position: relative; display: inline-block; height: 100%; }
    .nav-dropdown-btn { background: none; border: none; cursor: pointer; padding: 13px 18px; font-size: 13px; font-weight: 600; color: var(--gray-400); display: flex; align-items: center; gap: 6px; font-family: 'Plus Jakarta Sans', sans-serif; transition: color 0.15s; height: 100%; border-bottom: 3px solid transparent; }
    .nav-dropdown:hover .nav-dropdown-btn { color: var(--blue-main); }
    .nav-dropdown-btn.active { color: var(--blue-main); border-bottom-color: var(--blue-main); }
    .nav-dropdown-content { display: none; position: absolute; left: 0; top: 100%; background-color: var(--white); min-width: 240px; box-shadow: 0px 10px 25px rgba(0,34,68,0.1); border-radius: 8px; border: 1px solid var(--gray-200); z-index: 1000; flex-direction: column; padding: 8px; }
    .nav-dropdown:hover .nav-dropdown-content { display: flex; animation: slideDownNav 0.2s ease; }
    .nav-dropdown-item { padding: 10px 14px; color: var(--gray-600); text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 6px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; cursor: pointer; margin-bottom: 2px; }
    .nav-dropdown-item:hover { background-color: var(--blue-pale); color: var(--blue-main); }
    .nav-dropdown-item.active { background-color: var(--blue-pale); color: var(--blue-main); }
    .nav-dropdown-item i { font-size: 16px; }
    @keyframes slideDownNav { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* ── TYPOGRAPHY & LAYOUT DASHBOARD ── */
    .section-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px; }
    .section-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 20px; }

    /* ── STAT CARDS & MENU CARDS ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; border: 1px solid var(--gray-200); border-radius: 12px; padding: 24px 20px; display: flex; gap: 16px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .stat-val-box { display: flex; flex-direction: column; justify-content: center; }
    .stat-val-num { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; color: var(--blue-dark); margin: 4px 0 2px; line-height: 1; }
    .stat-val-text { font-size: 16px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .menu-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 22px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; cursor: pointer; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .menu-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,85,164,0.08); border-color: var(--blue-light); }
    
    /* ── ICONS & BADGES ── */
    .icon-box-lg { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .recent-list { display: flex; flex-direction: column; gap: 10px; }
    .recent-item { display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; transition: background 0.12s; box-shadow: 0 2px 8px rgba(0,0,0,0.01); }
    .recent-item:hover { background: var(--blue-pale); border-color: var(--blue-light); }
    .recent-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: #E0F2FE; color: #0284c7; }
    .recent-info { flex: 1; }
    .recent-id   { font-size: 12px; font-weight: 700; color: var(--blue-main); margin-bottom: 2px; }
    .recent-name { font-size: 14px; font-weight: 700; color: var(--gray-900); }
    .recent-date { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
  </style>

  <script>
    if (!sessionStorage.getItem('sitta_user')) {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>

<div id="app" v-cloak>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="logo-box" style="display: flex; background: var(--yellow); width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; color: #003876;">UT</div>
      <div class="brand-text" style="margin-left:10px;"><span class="brand-name">SITTA</span><span class="brand-sub">Universitas Terbuka</span></div>
    </div>
    <div class="topbar-right">
      <div class="user-chip"><div class="avatar" id="avatar-initial">A</div><span id="user-nama" style="font-size:13px;">Admin SITTA</span></div>
      <button class="logout-btn" onclick="doLogout()" type="button" style="background: none; border: none; cursor: pointer; color: var(--red); font-weight: 600; margin-left: 16px; font-family: inherit;">
        <i class="ti ti-logout" style="font-size:18px; vertical-align:-3px;"></i> Keluar
      </button>
    </div>
  </header>

  <nav class="nav-menu" role="navigation">
    <a class="nav-item" :class="{active: tab === 'dashboard'}" @click="tab = 'dashboard'"><i class="ti ti-layout-dashboard"></i> <span>Dashboard</span></a>
    <a class="nav-item" :class="{active: tab === 'stok'}" @click="tab = 'stok'"><i class="ti ti-books"></i> <span>Informasi Bahan Ajar</span></a>
    <a class="nav-item" :class="{active: tab === 'tracking'}" @click="tab = 'tracking'"><i class="ti ti-truck-delivery"></i> <span>Tracking Pengiriman</span></a>
    
    <div class="nav-dropdown">
      <button class="nav-dropdown-btn" :class="{active: tab === 'monitoring' || tab === 'rekap'}">
        <i class="ti ti-chart-bar"></i> <span>Laporan</span> <i class="ti ti-chevron-down" style="font-size: 14px; margin-left: 4px;"></i>
      </button>
      <div class="nav-dropdown-content">
        <a class="nav-dropdown-item" :class="{active: tab === 'monitoring'}" @click="tab = 'monitoring'">
          <i class="ti ti-activity" style="color: #0ea5e9;"></i> Monitoring Progress DO
        </a>
        <a class="nav-dropdown-item" :class="{active: tab === 'rekap'}" @click="tab = 'rekap'">
          <i class="ti ti-clipboard-data" style="color: #8b5cf6;"></i> Rekap Bahan Ajar
        </a>
      </div>
    </div>

    <a class="nav-item" :class="{active: tab === 'history'}" @click="tab = 'history'"><i class="ti ti-history"></i> <span>Histori Transaksi</span></a>
  </nav>

  <main class="main-content">
    <div v-if="isLoading" style="text-align: center; padding: 50px;">
      <i class="ti ti-loader" style="font-size: 40px; color: var(--blue-main); animation: spin 1s linear infinite;"></i>
      <p style="margin-top: 10px; font-weight: bold;">Memuat Database Sistem...</p>
    </div>
    <div v-else>
      <app-dashboard v-if="tab === 'dashboard'" :database="globalData"></app-dashboard>
      <ba-stock-table v-if="tab === 'stok'" :database="globalData"></ba-stock-table>
      <do-tracking v-if="tab === 'tracking'" :database="globalData"></do-tracking>
      <app-monitoring v-if="tab === 'monitoring'" :database="globalData"></app-monitoring>
      <app-laporan v-if="tab === 'rekap'" :database="globalData"></app-laporan>
      <app-history v-if="tab === 'history'" :database="globalData"></app-history>
    </div>
  </main>
</div>

<template id="tpl-dashboard">
  <div class="page-section active">
    
    <div style="background: linear-gradient(135deg, #002244 0%, #004e92 100%); color: #ffffff; padding: 28px 32px; border-radius: 12px; border-bottom: 6px solid #F5C518; margin-bottom: 32px; box-shadow: 0 4px 20px rgba(0,40,80,0.15);">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; color: #93c5fd; display: flex; align-items: center; gap: 6px; text-transform: uppercase;">
        {{ waktuKecil }}
      </div>
      <h2 style="margin: 0; font-family: 'Playfair Display', serif; font-size: 28px; letter-spacing: 0.5px;">{{ sapaan }}, Admin SITTA!</h2>
      <p style="margin: 8px 0 0; color: #bfdbfe; font-size: 13px; font-weight: 400;">Dashboard Aplikasi SITTA · {{ new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) }}</p>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="icon-box-lg" style="background:#E0F2FE;">📚</div>
        <div class="stat-val-box">
          <div style="font-size:11px; font-weight:700; color:var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px;">Total Bahan Ajar</div>
          <div class="stat-val-num">{{ totalJudul }} <span class="stat-val-text">judul</span></div>
          <div style="font-size:11px; color:var(--gray-400);">Data stok aktif</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-box-lg" style="background:#ECFDF5;">📦</div>
        <div class="stat-val-box">
          <div style="font-size:11px; font-weight:700; color:var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px;">Total Stok</div>
          <div class="stat-val-num">{{ totalStok.toLocaleString('id') }}</div>
          <div style="font-size:11px; color:var(--gray-400);">Seluruh lokasi</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-box-lg" style="background:#FFFBEB;">🚚</div>
        <div class="stat-val-box">
          <div style="font-size:11px; font-weight:700; color:var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px;">Delivery Order</div>
          <div class="stat-val-num">{{ totalPaket }} <span class="stat-val-text">paket</span></div>
          <div style="font-size:11px; color:var(--gray-400);">Terdaftar di sistem</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="icon-box-lg" style="background:#F3F4F6;">✅</div>
        <div class="stat-val-box">
          <div style="font-size:11px; font-weight:700; color:var(--gray-400); text-transform: uppercase; letter-spacing: 0.5px;">Transaksi Selesai</div>
          <div class="stat-val-num">{{ transaksiSelesai }} <span class="stat-val-text">transaksi</span></div>
          <div style="font-size:11px; color:var(--gray-400);">Dari {{ totalPaket }} total</div>
        </div>
      </div>
    </div>

    <h2 class="section-title">Menu Utama</h2>
    <p class="section-sub">Pilih menu untuk mengakses fitur SITTA</p>
    
    <div class="menu-grid">
      <div class="menu-card" @click="$parent.tab='stok'">
        <div class="icon-box-lg" style="background:#E0F2FE;">📚</div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--gray-900);">Informasi Bahan Ajar</div>
          <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">Lihat stok & data modul</div>
        </div>
      </div>
      <div class="menu-card" @click="$parent.tab='tracking'">
        <div class="icon-box-lg" style="background:#ECFDF5;">📦</div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--gray-900);">Tracking Pengiriman</div>
          <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">Lacak status paket DO</div>
        </div>
      </div>
      <div class="menu-card" @click="$parent.tab='monitoring'">
        <div class="icon-box-lg" style="background:#FFFBEB;">📊</div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--gray-900);">Monitoring Progress DO</div>
          <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">Pantau progress delivery order</div>
        </div>
      </div>
      <div class="menu-card" @click="$parent.tab='rekap'">
        <div class="icon-box-lg" style="background:#F5F3FF;">📋</div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--gray-900);">Rekap Bahan Ajar</div>
          <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">Laporan per periode</div>
        </div>
      </div>
      <div class="menu-card" @click="$parent.tab='history'">
        <div class="icon-box-lg" style="background:#FEF2F2;">🕐</div>
        <div>
          <div style="font-size: 14px; font-weight: 700; color: var(--gray-900);">Histori Transaksi</div>
          <div style="font-size: 12px; color: var(--gray-400); margin-top: 4px;">Riwayat transaksi bahan ajar</div>
        </div>
      </div>
    </div>

    <h2 class="section-title" style="margin-top: 40px;">Transaksi Terbaru</h2>
    <p class="section-sub">5 transaksi terakhir</p>
    
    <div class="recent-list">
      <div v-if="dataDOTerbaru.length === 0" style="padding: 24px; text-align: center; color: var(--gray-400); background: white; border: 1px dashed var(--gray-400); border-radius: 12px;">Belum ada transaksi pengiriman yang tercatat.</div>
      <div v-for="item in dataDOTerbaru" :key="item.noDO" class="recent-item">
        <div class="recent-icon">📋</div>
        <div class="recent-info">
          <div class="recent-id">{{ item.noDO }}</div>
          <div class="recent-name">{{ item.nama }} — {{ item.paket }}</div>
          <div class="recent-date">{{ item.tanggalKirimText || 'Baru Saja' }}</div>
        </div>
        <span style="background:#EEF5FC; color:#0055A4; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;">{{ item.statusInt === 4 ? 'Selesai' : 'Diproses' }}</span>
      </div>
    </div>
  </div>
</template>

<template id="tpl-stock">
  <div class="page-section active" style="position: relative; opacity: 1; visibility: visible; pointer-events: auto;">
    <div class="page-head">
      <h1 style="color: #0f172a; font-family: 'Playfair Display', serif;">Informasi Stok Bahan Ajar</h1>
      
    </div>

    <div class="add-form-card" style="border-left: 4px solid #facc15; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
      <div class="add-form-title" style="font-weight: 600; color: #0f172a; margin-bottom: 16px; font-size: 14px;"><i class="ti ti-plus" style="color:var(--blue-main);"></i> Tambah Data Bahan Ajar Baru</div>
      <form @submit.prevent="tambahStok">
        <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
          <div style="flex: 1; min-width: 120px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Kode MK *</label>
            <input type="text" v-model="formBaru.kode" placeholder="SKOM4101" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; text-transform:uppercase;" />
          </div>
          <div style="flex: 1.5; min-width: 150px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Nama MK *</label>
            <input type="text" v-model="formBaru.judul" placeholder="Nama modul" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;"/>
          </div>
          <div style="flex: 1; min-width: 120px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Kategori *</label>
            <select v-model="formBaru.kategori" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;">
              <option value="">Pilih Kategori</option>
              <option v-for="kat in kategoriList" :value="kat">{{ kat }}</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 120px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">UT-Daerah *</label>
            <select v-model="formBaru.upbjj" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;">
              <option value="">Pilih UT Daerah</option>
              <option v-for="ut in upbjjList" :value="ut">{{ ut }}</option>
            </select>
          </div>
          <div style="flex: 0.8; min-width: 80px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Lokasi Rak *</label>
            <input type="text" v-model="formBaru.lokasiRak" placeholder="R1-A5" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; text-transform:uppercase;"/>
          </div>
          <div style="flex: 1; min-width: 100px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Harga Satuan (Rp) *</label>
            <input type="number" v-model.number="formBaru.harga" placeholder="Contoh: 65000" required style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;"/>
          </div>
          <div style="flex: 1; min-width: 120px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Qty / Safety *</label>
            <div style="display: flex; gap: 5px;">
              <input type="number" v-model.number="formBaru.qty" placeholder="Qty" required style="width:50%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;"/>
              <input type="number" v-model.number="formBaru.safety" placeholder="Safet" required style="width:50%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;"/>
            </div>
          </div>
          <div style="flex: 1.2; min-width: 120px;">
            <label style="font-size:11px; font-weight:600; color:#64748b; margin-bottom:5px; display:block;">Catatan / HTML</label>
            <input type="text" v-model="formBaru.catatanHTML" placeholder="Opsional (Misal: Edis" style="width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px;"/>
          </div>
        </div>
        <p v-if="errorForm" style="color: var(--red); font-size: 12px; margin-top: 8px; font-weight: 600;">{{ errorForm }}</p>
        <div style="margin-top:16px; display:flex; gap:10px; align-items:center;">
          <button class="btn-primary" type="submit" style="background:#0055a4; border-radius:6px; padding:8px 16px; border:none; color:#fff; font-size:13px; font-weight:600;"><i class="ti ti-plus"></i> Tambah ke Tabel</button>
          <button class="btn-secondary" @click="resetForm()" type="button" style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:8px 16px; color:#475569; font-size:13px; font-weight:600;">Reset</button>
        </div>
      </form>
    </div>

    <div class="filter-container" style="background:#fff; padding:16px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:16px;">
      <div style="display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
        <div class="search-input-box" style="flex:1; min-width:200px; display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid #e2e8f0; border-radius:6px;"><i class="ti ti-search" style="color:#94a3b8;"></i><input type="text" v-model="searchQuery" @keyup.esc="resetFilter" placeholder="Cari BMP atau Kode..." style="border:none; outline:none; width:100%; font-family:inherit; font-size:13px;" /></div>
        <select v-model="filterUtDaerah" class="custom-select" style="padding:8px 12px; border:1px solid #e2e8f0; border-radius:6px; outline:none; font-size:13px;"><option value="">Semua UT-Daerah</option><option v-for="daerah in upbjjList" :value="daerah">{{ daerah }}</option></select>
        <select v-model="filterKategori" v-show="filterUtDaerah" class="custom-select" style="padding:8px 12px; border:1px solid #e2e8f0; border-radius:6px; outline:none; font-size:13px;"><option value="">Semua Kategori</option><option v-for="kat in kategoriList" :value="kat">{{ kat }}</option></select>
        <button class="reset-btn" @click="resetFilter" type="button" style="background:none; border:none; color:#64748b; font-size:13px; font-weight:600; cursor:pointer;"><i class="ti ti-refresh"></i> Reset</button>
      </div>
      <div style="display:flex; align-items:center; font-size:12px; font-weight:600; color:#475569; flex-wrap:wrap; gap:10px;">
        <span style="margin-right:2px;">URUTKAN:</span>
        <div style="display:flex; gap:8px;">
          <button class="sort-btn" :class="{active: sortOption==='judul'}" @click="setSort('judul')" style="padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #e2e8f0; cursor:pointer;">Judul {{ sortOption === 'judul' ? (sortDesc ? 'Z-A' : 'A-Z') : '⇅' }}</button>
          <button class="sort-btn" :class="{active: sortOption==='qty'}" @click="setSort('qty')" style="padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #e2e8f0; cursor:pointer;">Stok {{ sortOption === 'qty' ? (sortDesc ? '↓' : '↑') : '⇅' }}</button>
          <button class="sort-btn" :class="{active: sortOption==='harga'}" @click="setSort('harga')" style="padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #e2e8f0; cursor:pointer;">Harga {{ sortOption === 'harga' ? (sortDesc ? 'Tertinggi' : 'Terendah') : '⇅' }}</button>
        </div>
        <label style="margin-left:10px; display:flex; align-items:center; gap:5px; cursor:pointer;"><input type="checkbox" v-model="tampilkanKritis" /> TAMPILKAN STOK KRITIS</label>
        <span style="margin-left:auto; color:#94a3b8; font-weight:400;">{{ filteredStok.length }} item</span>
      </div>
    </div>

              <span v-else-if="item.statusInt === 3" style="background:#e0f2fe; color:#0369a1; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:600;">Dikirim</span>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="js/app.js"></script> 
<script src="js/components/stock-table.js"></script>
<script src="js/components/do-tracking.js"></script>

<script>
  // --- LOGIKA DASHBOARD ---
  app.component('app-dashboard', {
    template: '#tpl-dashboard',
    props: ['database'],
    computed: {
      sapaan() {
        const jam = new Date().getHours();
        if (jam < 3) return "Selamat Malam";
      
      // Jika jam 03:00 sampai 10:59 (jam 3 malam sampai jam 11 siang)
      if (jam < 11) return "Selamat Pagi";
      
      // Jika jam 11:00 sampai 14:59 (jam 11 siang sampai jam 3 sore)
      if (jam < 15) return "Selamat Siang";
      
      // Jika jam 15:00 sampai 17:59 (jam 3 sore sampai jam 6 sore)
      if (jam < 18) return "Selamat Sore";
      
      // Jika jam 18:00 ke atas sampai 23:59
      return "Selamat Malam";
    },
    
    waktuKecil() {
      const jam = new Date().getHours();
      
      if (jam < 3) return "🌙 MALAM";
      if (jam < 11) return "🌅 PAGI";
      if (jam < 15) return "☀️ SIANG";
      if (jam < 18) return "☁️ SORE";
      return "🌙 MALAM";
    },
      totalJudul() { return (this.database && this.database.stok) ? this.database.stok.length : 0; },
      totalStok() { return (this.database && this.database.stok) ? this.database.stok.reduce((sum, item) => sum + (item.qty || 0), 0) : 0; },
      totalPaket() { return (this.database && this.database.dataDO) ? this.database.dataDO.length : 0; },
      transaksiSelesai() { return (this.database && this.database.dataDO) ? this.database.dataDO.filter(d => d.statusInt === 4).length : 0; },
      dataDOTerbaru() { return (this.database && this.database.dataDO) ? this.database.dataDO.slice(0, 5) : []; }
    }
  });

  // --- LOGIKA MONITORING ---
  app.component('app-monitoring', { template: '#tpl-monitoring', props: ['database'] });

  // --- LOGIKA REKAP LAPORAN ---
  app.component('app-laporan', {
    template: '#tpl-laporan',
    props: ['database'],
    computed: {
      rekapData() {
        if (!this.database || !this.database.dataDO) return [];
        const rekap = {};
        this.database.dataDO.forEach(doItem => {
          const key = doItem.ekspedisi || 'Lain-lain';
          if (!rekap[key]) rekap[key] = { nama: key, totalDO: 0, totalSelesai: 0 };
          rekap[key].totalDO++;
          if (doItem.statusInt === 4) rekap[key].totalSelesai++;
        });
        return Object.values(rekap);
      }
    }
  });

  // --- LOGIKA HISTORI TRANSAKSI ---
  app.component('app-history', {
    template: '#tpl-history',
    props: ['database'],
    data() { return { searchQuery: '' } },
    computed: {
      filteredHistory() {
        if (!this.database || !this.database.dataDO) return [];
        const q = this.searchQuery.toLowerCase();
        return this.database.dataDO.filter(item => 
          (item.nama && item.nama.toLowerCase().includes(q)) ||
          (item.noDO && item.noDO.toLowerCase().includes(q)) ||
          (item.nim && item.nim.toLowerCase().includes(q))
        );
      }
    },
    methods: {
      hapusHistory(noDO) {
        if(confirm('Apakah Anda yakin ingin menghapus histori transaksi ini?')) {
          const index = this.database.dataDO.findIndex(d => d.noDO === noDO);
          if(index > -1) this.database.dataDO.splice(index, 1);
        }
      }
    }
  });

  // --- CEK SESI USER & LOGOUT ---
  const sesi = JSON.parse(sessionStorage.getItem('sitta_user') || 'null');

  if (sesi) {
    document.getElementById('user-nama').textContent = sesi.nama || 'Admin SITTA';
    document.getElementById('avatar-initial').textContent = (sesi.nama || 'A').charAt(0).toUpperCase();
  }

  window.doLogout = function() {
    if (confirm('Yakin ingin keluar dari SITTA?')) {
      sessionStorage.removeItem('sitta_user');
      window.location.replace('login.html');
    }
  };

  // Jalankan (mount) Vue ke dalam HTML
  app.mount('#app');
</script>
</body>
</html>
